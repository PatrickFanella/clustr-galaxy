name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Harness unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  ci-gate:
    name: CI gate
    if: always()
    needs: [harness-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'harness-tests'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
